name: Refresh box scores

# Vercel Hobby caps Vercel Cron at one run per day, so we drive the
# in-game refresh cadence from GitHub Actions instead. The route at
# /api/refresh handles authorization via the same CRON_SECRET that
# Vercel Cron uses, so this is just a second caller of the same endpoint.
#
# Schedule covers NBA game hours year-round, including holiday/weekend
# day games (earliest tips ~noon ET). Times are UTC; ET is UTC-4 (EDT)
# or UTC-5 (EST), so noon ET falls at 16:00–17:00 UTC.
#   16:00–21:59 UTC  every 10 min — afternoon/day games (noon–6pm ET)
#   22:00–23:59 UTC  every  5 min — evening prime
#   00:00–08:59 UTC  every  5 min — late games through ~3-4am ET (West-coast OTs)
# GitHub Actions cron is "best effort" and can lag a few minutes under
# load, which is fine for "page updates within minutes of a game ending."
on:
  schedule:
    - cron: '*/10 16-21 * * *'
    - cron: '*/5 22-23 * * *'
    - cron: '*/5 0-8 * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/refresh
        env:
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Set repo variable DEPLOYMENT_URL (e.g. https://nba-boxscore.vercel.app)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set repo secret CRON_SECRET (must match Vercel env var)"
            exit 1
          fi
          http_code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOYMENT_URL/api/refresh")
          echo "HTTP $http_code"
          cat /tmp/body | head -c 4000
          echo
          # 200 = clean, 207 = partial (one league failed) — both acceptable
          if [ "$http_code" != "200" ] && [ "$http_code" != "207" ]; then
            exit 1
          fi
